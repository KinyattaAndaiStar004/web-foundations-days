
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DAY 4 TRIAL</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>KINYATTA'S DAY 4 TRIAL</h1>
        <h2>A Simple Trial Page</h2>
    </header>

    <main>
        <h3>DAY 4 TRIAL</h3>

        <p>
            Welcome to the Day 4 Trial page.
            This is a sample HTML structure with linked CSS
            and JavaScript files.
        </p>

        <section>
            <label for="note-text">Enter your note:</label><br>

    <footer>
        <p>Day 4 Web Development Practice</p>
    </footer>
