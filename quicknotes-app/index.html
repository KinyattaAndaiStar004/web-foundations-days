<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickNotes</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>WEEK 4 PROJECT</h1>
        <p>Kinyatta's QuickNotes App</p>
    </header>

    <main>

        <!-- Section for adding a new note -->
        <section>
            <h2>Add a Note</h2>

            <form id="note-form">

                <label for="note-input">New Note</label><br>

                <input
                    type="text"
                    id="note-input"
                    name="note"
                    placeholder="What do you want to remember?"
                    required
                ><br>

                <label for="note-category">Category</label><br>

                <select id="note-category" name="category">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                </select><br><br>

                <button type="submit">Add Note</button>

            </form>

            <p id="error-message"></p>
        </section>


        <!-- Section for displaying existing notes -->
        <section>
            <h2>Your Notes</h2>

            <input
                type="text"
                id="search-input"
                name="search"
                placeholder="Search your notes..."
            >

            <br><br>

            <button type="button" id="clear-all">Clear all</button>

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Kinyatta's QuickNotes App</p>
    </footer>

</body>

</html>
